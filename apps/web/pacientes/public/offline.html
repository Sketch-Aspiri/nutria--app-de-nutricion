<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" />
    <title>Sin conexión — nutria</title>
    <!--
      Página del cascarón offline. Va suelta y sin depender de nada del build
      porque tiene que poder abrirse justo cuando la red no responde: si
      importara una fuente, una hoja de estilo o un bundle, no se vería.
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 32px;
        background: #fafaf9;
        color: #1c1917;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        color: #022c22;
      }
      p {
        margin: 0;
        max-width: 22rem;
        font-size: 14px;
        line-height: 1.5;
        color: #57534e;
      }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 500;
        color: #ffffff;
        background: #064e3b;
      }
    </style>
  </head>
  <body>
    <h1>Sin conexión</h1>
    <!-- Nada de "lo guardamos y se sincroniza después": la V1 no tiene cola de
         escritura sin conexión, y prometerla haría que alguien registrara su
         comida creyendo que quedó guardada. -->
    <p>No pudimos cargar tu información. Revisa tu señal e inténtalo de nuevo.</p>
    <button type="button" onclick="window.location.reload()">Reintentar</button>
  </body>
</html>
