name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Base efímera del runner: ningún paso toca datos reales.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nutria_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/nutria_ci
  E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nutria_e2e_test
  E2E_ALLOW_DB_MUTATION: "true"
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nutria_shadow
  AUTH_SECRET: secreto-solo-para-ci-no-usar-en-produccion
  AUTH_URL: http://localhost:3000
  # 32 bytes deterministas exclusivos del runner; nunca cifra datos reales.
  ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  ENCRYPTION_KEY_ID: ci

jobs:
  verificacion:
    name: Esquema, tipos, tests y build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nutria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Preparar base de sombra
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE nutria_shadow;'
          psql "$DATABASE_URL" -c 'CREATE DATABASE nutria_e2e_test;'

      - name: Validar el esquema de Prisma
        run: npx prisma validate
        working-directory: apps/web/nutriologos

      - name: Aplicar migraciones
        run: npx prisma migrate deploy
        working-directory: apps/web/nutriologos

      - name: Verificar que no haya deriva entre migraciones y esquema
        # Falla si alguien editó schema.prisma sin generar su migración.
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code \
          || (echo "::error::schema.prisma cambió sin migración. Corre 'npm run db:migrate'." && exit 1)
        working-directory: apps/web/nutriologos

      - name: Type-check
        run: npm run type-check --workspaces --if-present

      - name: Tests
        run: npm run test --workspaces --if-present -- --coverage

      - name: Build de la app web
        run: npm run build --workspace apps/web/nutriologos

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web/nutriologos

      - name: Aplicar migraciones a la base E2E
        run: npx prisma migrate deploy
        working-directory: apps/web/nutriologos
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          DIRECT_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Sembrar catálogo de prueba en la base E2E
        run: npm run db:seed
        working-directory: apps/web/nutriologos
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          DIRECT_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Tests E2E
        run: npm run test:e2e --workspace apps/web/nutriologos

      - name: Guardar reporte de E2E si algo falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/nutriologos/test-results/
          retention-days: 7
